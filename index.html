<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rent cinema cameras, professional lenses, lighting, and production kits with real-time serial-number inventory at CameraRent."
    />
    <meta name="theme-color" content="#18181b" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CameraRent" />
    <meta property="og:title" content="CameraRent — Production Gear & Camera Rental Operations" />
    <meta
      property="og:description"
      content="Rent cinema cameras, professional lenses, lighting, and production kits with real-time serial-number inventory at CameraRent."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Loading...</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('camerarent-site-seo-v1');
          if (!raw) return;
          var seo = JSON.parse(raw);
          var t = (seo && (seo.siteTitle || seo.siteName) || '').trim();
          if (t) document.title = t;
          if (seo && seo.faviconUrl && seo.faviconUrl.trim()) {
            var icon = document.querySelector('link[rel="icon"]');
            if (icon) icon.setAttribute('href', seo.faviconUrl.trim());
          }
          if (seo && seo.themeColor && seo.themeColor.trim()) {
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute('content', seo.themeColor.trim());
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-zinc-900 selection:text-zinc-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
